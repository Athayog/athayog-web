name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

permissions:
    contents: read

jobs:
    verify:
        name: Lint, Typecheck, Test & Build
        runs-on: ubuntu-latest

        env:
            NEXT_PUBLIC_FIREBASE_API_KEY: "dummy-api-key"
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "dummy.firebaseapp.com"
            NEXT_PUBLIC_FIREBASE_PROJECT_ID: "dummy-project"
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "dummy.appspot.com"
            NEXT_PUBLIC_FIREBASE_APPID: "1:123456789:web:123456"
            FIREBASE_CLIENT_EMAIL: "dummy@dummy.iam.gserviceaccount.com"
            FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC...\n-----END PRIVATE KEY-----\n"
            NEXT_PUBLIC_PRISMIC_REPOSITORY_NAME: "athayog"
            NEXT_PUBLIC_RAZORPAY_KEY_ID: "rzp_test_dummy"
            RAZORPAY_KEY_SECRET: "dummy_secret"
            RAZORPAY_WEBHOOK_SECRET: "dummy_webhook_secret"

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: "npm"

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Guard Firebase Admin major version (Vercel CJS compat)
              run: node -e "const v=require('./node_modules/firebase-admin/package.json').version; if (!v.startsWith('12.')) { console.error('firebase-admin v'+v+' is not Vercel/CJS compatible - keep the 12.x line (jose@4). See docs/deployment.md'); process.exit(1); }"

            - name: Check Formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npx tsc --noEmit

            - name: Run Vitest Unit Tests
              run: npm test

            - name: Build Next.js Bundle
              run: npx next build
